<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D11" id="themeMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Limit Bell</title>
<style>
:root{
  --bg:#0B0D11;--bg2:#0F1217;--sf:#161A21;--sf2:#1C212A;--sf3:#242A35;
  --ln:#282E39;--ln2:#39404D;
  --tx:#EDF0F5;--mu:#98A1B1;--mu2:#707A8B;
  --ac:#F08A5D;--acT:#1A0F0A;--acS:rgba(240,138,93,.14);
  --ok:#63DFA0;--okS:rgba(99,223,160,.13);
  --wt:#F3C463;--wtS:rgba(243,196,99,.13);
  --wk:#63C9D9;--wkS:rgba(99,201,217,.13);
  --bad:#FF8B81;--badS:rgba(255,139,129,.13);
  --nav:rgba(13,16,21,.88);
  --sh:0 18px 44px -22px rgba(0,0,0,.9);
  --r:18px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F2F4F8;--bg2:#FFFFFF;--sf:#FFFFFF;--sf2:#F1F3F8;--sf3:#E7EAF1;
  --ln:#E1E5EE;--ln2:#CBD2DE;
  --tx:#101318;--mu:#5C6472;--mu2:#8B93A2;
  --acS:rgba(194,80,31,.10);
  --ok:#12804A;--okS:rgba(18,128,74,.10);
  --wt:#8A5A00;--wtS:rgba(138,90,0,.10);
  --wk:#0B6C79;--wkS:rgba(11,108,121,.10);
  --bad:#C0392B;--badS:rgba(192,57,43,.10);
  --nav:rgba(255,255,255,.92);
  --sh:0 18px 44px -26px rgba(15,23,42,.30);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx)}
h1,h2,h3,p,figure{margin:0}
h1{font-size:25px;font-weight:800;letter-spacing:-.025em}
h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.mu{color:var(--mu)}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mu2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sp{flex:1;min-width:0}
.center{text-align:center}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin-inline:auto;position:relative}
#view{
  flex:1;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 16px) 16px 20px;
  display:flex;flex-direction:column;gap:16px;
}
nav{
  display:flex;gap:4px;padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--ln);z-index:10;
}
nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:52px;border-radius:15px;font-size:10.5px;font-weight:650;color:var(--mu);
  transition:background .18s,color .18s,transform .12s;
}
nav button:active{transform:scale(.96)}
nav button.on{color:var(--ac);background:var(--acS)}

/* ---------- primitives ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{
  min-height:38px;padding:0 14px;border-radius:11px;background:var(--sf2);border:1px solid var(--ln);
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s,background .18s,opacity .18s;
}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ac);border-color:transparent;color:var(--acT)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btn.wide{width:100%;min-height:50px;border-radius:15px;font-size:15px}
.fab{
  width:48px;height:48px;border-radius:26px;background:var(--ac);color:var(--acT);flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px -8px var(--ac);
  transition:transform .14s;
}
.fab:active{transform:scale(.92)}
.fab .ic{stroke-width:2.5;width:24px;height:24px}

.chip{
  flex:none;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#0B0D11;
}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.pill.wait{background:var(--wtS);color:var(--wt)}
.pill.ready{background:var(--okS);color:var(--ok)}
.pill.work{background:var(--wkS);color:var(--wk)}
.big{font-size:22px;font-weight:750;letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:6px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .55s linear}
.sub{font-size:12px;color:var(--mu);margin-top:1px}

.list{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--ln);min-height:52px}
.li:first-child{border-top:0}
.li .t{font-weight:650;font-size:14px}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--sf2)}

.tg{width:44px;height:26px;border-radius:99px;background:var(--ln);padding:3px;display:flex;align-items:center;flex:none;transition:background .2s}
.tg i{width:20px;height:20px;border-radius:99px;background:var(--tx);display:block;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:var(--ac);justify-content:flex-end}
.tg.on i{background:var(--acT)}

.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg2 button{min-height:38px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mu);transition:background .18s,color .18s}
.seg2 button.on{background:var(--ac);color:var(--acT)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.opt{
  min-height:42px;border-radius:12px;background:var(--sf2);border:1px solid var(--ln);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;
  transition:background .16s,border-color .16s,color .16s,transform .1s;
}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--ac);border-color:transparent;color:var(--acT)}

.field{
  width:100%;min-height:46px;background:var(--sf2);border:1px solid var(--ln);border-radius:13px;
  padding:0 13px;outline:none;transition:border-color .18s,background .18s;
}
.field:focus{border-color:var(--ac);background:var(--sf)}
textarea.field{padding:11px 13px;min-height:104px;resize:vertical;line-height:1.5}
input[type=time].field{color-scheme:inherit}
::placeholder{color:var(--mu2)}

.swatch{width:34px;height:34px;border-radius:12px;background:var(--sw);border:2px solid transparent;transition:transform .12s}
.swatch.on{border-color:var(--tx);transform:scale(1.08)}
.sw{width:30px;height:30px;border-radius:10px;background:var(--sw);border:2px solid transparent}
.sw.on{border-color:var(--tx);transform:scale(1.1)}

.stat{font-size:21px;font-weight:780;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.statgrid>div{min-width:0}

.chart{display:flex;align-items:flex-end;gap:3px;height:88px}
.cbar{flex:1;display:flex;align-items:flex-end;height:100%;min-width:2px}
.cbar i{display:block;width:100%;background:var(--ln2);border-radius:3px;min-height:3px;transition:height .3s}
.cbar.today i{background:var(--ac)}

.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:34px;padding:0 14px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-size:12.5px;font-weight:650;color:var(--mu);transition:background .16s,color .16s,border-color .16s}
.fchip.on{background:var(--ac);border-color:transparent;color:var(--acT)}

.hrow{background:var(--sf);border:1px solid var(--ln);border-radius:15px;padding:11px 6px 11px 13px;display:flex;gap:10px;align-items:flex-start}
.del{flex:none;width:38px;height:38px;margin:-4px -2px -4px 0;display:flex;align-items:center;justify-content:center;color:var(--mu2);border-radius:11px}
.del:active{background:var(--badS);color:var(--bad)}
.dayhead{display:flex;align-items:center;gap:8px;margin:2px 0 -4px}
.dayhead .ln{flex:1;height:1px;background:var(--ln)}

.note{font-size:12px;color:var(--mu);line-height:1.55;padding:0 2px}
.empty{text-align:center;color:var(--mu);padding:38px 22px;line-height:1.65;font-size:13.5px}
.prev{background:var(--sf2);border:1px solid var(--ln);border-radius:14px;padding:13px 15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}

/* hero */
.hero{background:linear-gradient(160deg,var(--sf) 0%,var(--sf) 55%,var(--acS) 190%);position:relative;overflow:hidden}
.hero .big{font-size:40px;letter-spacing:-.035em;font-weight:780}
.ring{transform:rotate(-90deg);flex:none}
.ringbg{fill:none;stroke:var(--ln);stroke-width:7}
.ringfg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .7s linear}

.acc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .12s,border-color .18s}
.acc:active{transform:scale(.985)}
.acc .nm{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.more{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu2);flex:none;margin:-6px -6px -6px 0}
.more:active{background:var(--sf2)}

/* ---------- scrim + sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin-inline:auto;max-height:92dvh;
  background:var(--bg2);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;
  z-index:45;display:flex;flex-direction:column;transform:translateY(101%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:var(--sh);
}
#sheet.on{transform:translateY(0)}
#sheetBody{overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 18px;display:flex;flex-direction:column;gap:16px}
#sheetFoot{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--ln);background:var(--bg2)}
#sheetFoot:empty{display:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--ln2);margin:10px auto 6px;flex:none}
.sheethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:2px}
.xbtn{width:36px;height:36px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none}
.xbtn:active{background:var(--sf3)}
.accgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who{
  min-height:72px;border-radius:14px;background:var(--sf);border:1.5px solid var(--ln);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 4px;font-size:11px;font-weight:650;transition:border-color .16s,background .16s;
}
.who.on{border-color:var(--ac);background:var(--acS)}
.who span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:22px;z-index:70;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modalCard{background:var(--bg2);border:1px solid var(--ln);border-radius:20px;padding:20px;max-width:380px;width:100%;box-shadow:var(--sh);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

#alert{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:22px;z-index:80;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#alert.on{display:flex}
.alertcard{background:var(--bg2);border:2px solid var(--ok);border-radius:24px;padding:24px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 60px -12px var(--ok);animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
.alertico{font-size:38px;line-height:1;margin-bottom:10px}
.alertbtns{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,14px);
  background:#000000dd;color:#fff;padding:11px 12px 11px 18px;border-radius:99px;font-size:13px;
  display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.26s;max-width:92%;
  z-index:90;box-shadow:0 12px 30px -12px #000;
}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toastBtn{background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;font-weight:700;font-size:12.5px;flex:none}
#toastBtn[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="view" role="main"></div>
  <nav id="tabbar">
    <button data-tab="acc" aria-label="Accounts">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 4 3 6M19 4l2 2"/></svg>
      <span>Accounts</span>
    </button>
    <button data-tab="ses" aria-label="Sessions">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Sessions</span>
    </button>
    <button data-tab="set" aria-label="Settings">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 6h4M14 6h6M4 12h10M18 12h2M4 18h6M12 18h8"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="scrim" data-closesheet></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Sheet">
  <div class="grab"></div>
  <div id="sheetBody"></div>
  <div id="sheetFoot"></div>
</div>

<div id="modal" role="dialog" aria-modal="true"><div id="modalCard"></div></div>

<div id="alert" role="alertdialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="alertcard">
    <div class="alertico">🔔</div>
    <h2 id="aTitle">Limit reset</h2>
    <p id="aBody" class="mu" style="font-size:13.5px;margin-top:8px"></p>
    <div class="alertbtns">
      <button class="btn pri wide" id="aStart">Start session</button>
      <div class="row" style="gap:8px">
        <button class="btn sp" id="aSnz">Snooze 5 min</button>
        <button class="btn sp" id="aDismiss">Dismiss</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script>
/* ============================================================
   Limit Bell — v3
   ============================================================ */
const COLORS=[
  {c:'#5CC8D7',n:'Teal'},{c:'#A99BFF',n:'Violet'},{c:'#FF8FB1',n:'Rose'},
  {c:'#B4DC6A',n:'Lime'},{c:'#F0A05D',n:'Amber'},{c:'#7FB3FF',n:'Blue'}
];
const ACCENTS={
  ember:{n:'Ember',d:['#F08A5D','#1A0F0A','rgba(240,138,93,.15)'],l:['#C2501F','#FFFFFF','rgba(194,80,31,.10)']},
  ocean:{n:'Ocean',d:['#5CC8D7','#04212A','rgba(92,200,215,.15)'],l:['#0B6C79','#FFFFFF','rgba(11,108,121,.10)']},
  mint:{n:'Mint',d:['#63DFA0','#04241A','rgba(99,223,160,.15)'],l:['#12734A','#FFFFFF','rgba(18,115,74,.10)']},
  iris:{n:'Iris',d:['#A99BFF','#100A2A','rgba(169,155,255,.17)'],l:['#5A45C8','#FFFFFF','rgba(90,69,200,.10)']},
  rose:{n:'Rose',d:['#FF8FB1','#2A0714','rgba(255,143,177,.15)'],l:['#B32B57','#FFFFFF','rgba(179,43,87,.10)']}
};
const TONES=[
  {id:'default',n:'System default'},{id:'chime',n:'Chime'},{id:'bell',n:'Bell'},
  {id:'beep',n:'Beep'},{id:'alarm',n:'Alarm (loud)'}
];
const DBKEY='limitBell.v3';
const DEF={
  theme:'dark',accent:'ember',tone:'default',
  early:true,earlyMin:10,repeat:false,repeatMin:10,
  vib:true,haptics:true,inApp:true,
  windowH:5,keepDays:0,defaultHours:3
};

/* ---------------- tiny utils ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pad=n=>String(n).padStart(2,'0');
const fmtT=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtD=ms=>new Date(ms).toLocaleDateString([],{month:'short',day:'numeric'});
const fmtLeft=ms=>{
  ms=Math.max(0,ms);const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  return h>0?h+':'+pad(m)+':'+pad(sec):m+':'+pad(sec);
};
const fmtDur=ms=>{
  const m=Math.max(0,Math.round(ms/60000));
  if(m<60)return m+'m';
  const h=Math.floor(m/60),r=m%60;
  return h+'h'+(r?' '+pad(r)+'m':'');
};
const dayStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
let _seq=1;
const uid=p=>p+Date.now().toString(36)+(_seq++).toString(36);
const loadJSON=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const saveJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------------- native bridge ---------------- */
const CAP=window.Capacitor;
const native=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
let LN=null,SO=null,HA=null,APP=null;
if(native){
  try{LN=(CAP.Plugins&&CAP.Plugins.LocalNotifications)||CAP.registerPlugin('LocalNotifications')}catch(e){}
  try{SO=CAP.registerPlugin('SettingsOpener')}catch(e){}
  try{HA=(CAP.Plugins&&CAP.Plugins.Haptics)||CAP.registerPlugin('Haptics')}catch(e){}
  try{APP=CAP.registerPlugin('App')}catch(e){}
  document.body.classList.add('native');
}

/* ---------------- data ---------------- */
function migrate(){
  const raw=loadJSON(DBKEY,null);
  if(raw&&raw.v===3&&Array.isArray(raw.accounts))return raw;

  const oldA=loadJSON('limitReminderV1',null);
  const oldS=loadJSON('limitBellSettings',{})||{};
  const oldL=loadJSON('limitBellSessions',[])||[];
  const src=(Array.isArray(oldA)&&oldA.length)
    ? oldA
    : [1,2,3,4].map(i=>({id:i,name:'Account '+i,resetAt:null,startedAt:null,hitAt:null,notified:true}));

  const accounts=src.map((a,i)=>({
    id:uid('a'),nid:i+1,name:a.name||('Account '+(i+1)),color:i%COLORS.length,
    resetAt:a.resetAt||null,startedAt:a.startedAt||null,hitAt:a.hitAt||null,
    notified:a.notified!==false,windowH:DEF.windowH,alerts:true
  }));
  const map={};accounts.forEach((a,i)=>{map[i]=a.id});
  const log=(Array.isArray(oldL)?oldL:[]).filter(Boolean).map((s,i)=>({
    id:s.id||uid('l'),acc:map[s.acc]||accounts[0].id,
    an:(src[s.acc]&&src[s.acc].name)||null,
    hitAt:s.hitAt||Date.now(),startedAt:s.startedAt||null,
    resetAt:s.resetAt||Date.now()+DEF.windowH*3600e3,note:s.note||''
  }));
  const settings=Object.assign({},DEF,{
    theme:oldS.theme==='light'||oldS.theme==='system'?oldS.theme:'dark',
    tone:oldS.tone||'default',
    early:oldS.early!==false,
    repeat:!!oldS.repeat,
    keepDays:typeof oldS.keepDays==='number'?oldS.keepDays:0
  });
  return {v:3,accounts,log,settings};
}

/* ---------------- derived state ---------------- */
function stateOf(a,t){
  t=t||Date.now();
  if(a.resetAt&&a.resetAt>t)return 'wait';
  if(a.startedAt)return 'work';
  if(a.resetAt&&t-a.resetAt<6*3600e3)return 'ready';
  return 'free';
}
const ORDER={wait:0,ready:1,work:2,free:3};
function sortedAccounts(t){
  t=t||Date.now();
  return db.accounts.slice().sort((x,y)=>{
    const sx=stateOf(x,t),sy=stateOf(y,t);
    if(sx!==sy)return ORDER[sx]-ORDER[sy];
    if(sx==='wait')return x.resetAt-y.resetAt;
    if(sx==='ready')return y.resetAt-x.resetAt;
    return 0;
  });
}
const chipOf=a=>{
  const c=COLORS[(a.color||0)%COLORS.length].c;
  return '<span class="chip" style="background:'+c+'">'+esc((a.name||'?').trim().charAt(0).toUpperCase())+'</span>';
};
const logName=l=>l.an||((db.accounts.find(a=>a.id===l.acc)||{}).name)||'Account';
const logColor=l=>{
  const a=db.accounts.find(x=>x.id===l.acc);
  return COLORS[((a&&a.color)||0)%COLORS.length].c;
};

function parts(a,t){
  const s=stateOf(a,t);
  const W=(a.windowH||db.settings.windowH||5)*3600e3;
  if(s==='wait'){
    const start=a.hitAt||(a.resetAt-W);
    const tot=Math.max(60e3,a.resetAt-start);
    const left=a.resetAt-t;
    return {s:s,pill:'Waiting',time:fmtLeft(left),sub:'Resets at '+fmtT(a.resetAt),
      pct:clamp(100-left/tot*100,0,100),col:'var(--wt)',tc:'var(--tx)'};
  }
  if(s==='work'){
    const el=t-a.startedAt;
    return {s:s,pill:'Working',time:fmtLeft(el),sub:'Started '+fmtT(a.startedAt),
      pct:clamp(el/W*100,0,100),col:'var(--wk)',tc:'var(--wk)'};
  }
  if(s==='ready'){
    return {s:s,pill:'Ready',time:'Ready now',sub:'Reset at '+fmtT(a.resetAt),
      pct:100,col:'var(--ok)',tc:'var(--ok)'};
  }
  return {s:s,pill:'Free',time:'Not limited',sub:'Tap to log a limit',
    pct:0,col:'var(--ln2)',tc:'var(--mu)'};
}

/* ---------------- haptics / sound ---------------- */
function buzz(pattern){
  if(!db.settings.vib)return;
  try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}
}
function tap(style){
  if(!db.settings.haptics)return;
  try{
    if(HA&&HA.impact){HA.impact({style:style||'LIGHT'}).catch(()=>{});return}
    if(navigator.vibrate)navigator.vibrate(8);
  }catch(e){}
}
let AC=null;
function beep(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    [0,.3,.6].forEach(off=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=880;
      o.connect(g);g.connect(AC.destination);
      const t0=AC.currentTime+off;
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(.22,t0+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.24);
      o.start(t0);o.stop(t0+.26);
    });
  }catch(e){}
}
function playTone(id){
  id=id||db.settings.tone;
  if(id==='default'){beep();return}
  try{
    const a=new Audio('sounds/'+id+'.wav');
    const p=a.play();
    if(p&&p.catch)p.catch(beep);
  }catch(e){beep()}
}

const channel=()=>'limit_'+db.settings.tone;

async function nativeInit(){
  if(!LN)return;
  for(const t of TONES){
    const o={id:'limit_'+t.id,name:'Limit reset · '+t.n,description:'Limit Bell alerts',
      importance:5,visibility:1,vibration:true};
    if(t.id!=='default')o.sound=t.id+'.wav';
    try{await LN.createChannel(o)}catch(e){}
  }
}
let askedExact=false;
async function ensureReady(){
  if(!LN){toast('Notification plugin not found');return false}
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted')p=await LN.requestPermissions();
    if(p.display!=='granted'){toast('Notifications are blocked — enable them in Settings');return false}
  }catch(e){toast('Permission error: '+(e.message||e));return false}
  try{
    const ex=await LN.checkExactNotificationSetting();
    if(ex.exact_alarm!=='granted'&&!askedExact){
      askedExact=true;
      toast('Turn on “Alarms & reminders”, then come back');
      await LN.changeExactNotificationSetting();
    }
  }catch(e){}
  return true;
}
async function pendingCount(){try{return (await LN.getPending()).notifications.length}catch(e){return -1}}
async function cancelFor(a){
  if(!LN)return;
  const i=idsFor(a);
  try{await LN.cancel({notifications:[{id:i.reset},{id:i.early},{id:i.rep}]})}catch(e){}
}
async function scheduleFor(a,quiet){
  if(!LN||!a.resetAt)return;
  await cancelFor(a);
  if(a.alerts===false)return;
  const now=Date.now(),i=idsFor(a),list=[];
  const S=db.settings;
  if(a.resetAt>now+5000){
    list.push({id:i.reset,title:a.name+' is ready',body:'Limit reset. Time to get back to work.',
      schedule:{at:new Date(a.resetAt),allowWhileIdle:true},channelId:channel()});
  }
  if(S.early&&a.resetAt-S.earlyMin*60e3>now+8000){
    list.push({id:i.early,title:a.name+' resets in '+S.earlyMin+' min',
      body:'Heads up — reset at '+fmtT(a.resetAt)+'.',
      schedule:{at:new Date(a.resetAt-S.earlyMin*60e3),allowWhileIdle:true},channelId:channel()});
  }
  if(S.repeat&&a.resetAt+S.repeatMin*60e3>now+8000){
    list.push({id:i.rep,title:a.name+' is still waiting',
      body:'The limit reset '+S.repeatMin+' minutes ago.',
      schedule:{at:new Date(a.resetAt+S.repeatMin*60e3),allowWhileIdle:true},channelId:channel()});
  }
  if(!list.length)return;
  try{
    await LN.schedule({notifications:list});
    if(!quiet){
      const n=await pendingCount();
      toast(a.name+': alert set for '+fmtT(a.resetAt)+(n>=0?' · '+n+' scheduled':''));
    }
  }catch(e){toast('Scheduling error: '+(e.message||e))}
}
function rescheduleAll(){
  if(!native)return;
  db.accounts.forEach(a=>{if(a.resetAt)scheduleFor(a,true)});
}

    return d.getTime();
  }
  const h=(sh&&sh.hours)||db.settings.defaultHours||3;
  return Date.now()+h*3600e3;
}

async function saveLog(){
  const a=db.accounts.find(x=>x.id===sh.accId);
  if(!a){toast('Account not found');return}
  const t=Date.now(),tgt=logTarget();
  if(tgt<t+30e3){toast('Pick a time in the future');return}
  const s=stateOf(a,t);
  if(native&&!(await ensureReady()))return;

  if(sh.save){
    if(s==='wait'){
      let last=null;
      for(let i=db.log.length-1;i>=0;i--){if(db.log[i].acc===a.id){last=db.log[i];break}}
      if(last){last.resetAt=tgt;if(sh.note)last.note=sh.note}
      else db.log.push({id:uid('l'),acc:a.id,an:a.name,hitAt:a.hitAt||t,
        startedAt:a.startedAt||null,resetAt:tgt,note:sh.note||''});
    }else{
      db.log.push({id:uid('l'),acc:a.id,an:a.name,hitAt:t,
        startedAt:a.startedAt||null,resetAt:tgt,note:sh.note||''});
    }
    pruneLog();
  }

  if(s!=='wait')a.hitAt=t;
  a.resetAt=tgt;a.notified=false;a.startedAt=null;
  persist();

  if(native)await scheduleFor(a,false);
  closeSheet();
  lastStates='';
  render();
  toast(a.name+' · alert at '+fmtT(tgt));
  tap('MEDIUM');
}

/* ---------- accounts ---------- */
function heroData(t){
  const waits=db.accounts.filter(a=>stateOf(a,t)==='wait').sort((x,y)=>x.resetAt-y.resetAt);
  if(waits.length){
    const a=waits[0];
    const W=(a.windowH||db.settings.windowH)*3600e3;
    const start=a.hitAt||(a.resetAt-W);
    const tot=Math.max(60e3,a.resetAt-start);
    return {cap:'Next reset',time:fmtLeft(a.resetAt-t),
      sub:a.name+' · '+fmtT(a.resetAt),
      pct:clamp(100-(a.resetAt-t)/tot*100,0,100),col:'var(--wt)'};
  }
  const ready=db.accounts.find(a=>stateOf(a,t)==='ready');
  if(ready)return {cap:'Status',time:'Ready',sub:ready.name+' became free at '+fmtT(ready.resetAt),
    pct:100,col:'var(--ok)'};
  const work=db.accounts.find(a=>stateOf(a,t)==='work');
  if(work)return {cap:'Session running',time:fmtLeft(t-work.startedAt),
    sub:work.name+' · started '+fmtT(work.startedAt),
    pct:clamp((t-work.startedAt)/((work.windowH||5)*3600e3)*100,0,100),col:'var(--wk)'};
  return {cap:'Status',time:'All clear',sub:'No limits logged. Tap + when an account runs out.',pct:0,col:'var(--ln2)'};
}
function ringSVG(pct,color){
  const r=32,c=2*Math.PI*r,off=c*(1-clamp(pct,0,100)/100);
  return '<svg class="ring" viewBox="0 0 80 80" width="76" height="76" aria-hidden="true">'+
    '<circle class="ringbg" cx="40" cy="40" r="'+r+'"/>'+
    '<circle class="ringfg" id="heroRing" cx="40" cy="40" r="'+r+'" stroke="'+color+'" '+
      'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/></svg>';
}

function filteredLogs(){
  const q=search.trim().toLowerCase();
  return db.log.filter(l=>{
    if(fil!=='all'&&l.acc!==fil)return false;
    if(!q)return true;
    return (l.note||'').toLowerCase().indexOf(q)>=0||logName(l).toLowerCase().indexOf(q)>=0;
  }).sort((x,y)=>y.hitAt-x.hitAt);
}
function historyHTML(){
  return '<div class="row" style="gap:8px">'+
      '<input class="field" id="searchIn" placeholder="Search notes or accounts…" value="'+esc(search)+'" style="min-height:42px">'+
    '</div>'+
    '<div class="fchips">'+
      '<button class="fchip '+(fil==='all'?'on':'')+'" data-fil="all">All</button>'+
      db.accounts.map(a=>'<button class="fchip '+(fil===a.id?'on':'')+'" data-fil="'+a.id+'">'+esc(a.name)+'</button>').join('')+
    '</div>'+
    '<div id="listWrap">'+listHTML()+'</div>';
}
function listHTML(){
  const rows=filteredLogs();
  if(!rows.length){
    return '<div class="empty">'+(db.log.length?
      'Nothing matches this filter.':'No sessions yet.<br>Log a limit and it shows up here.<br>Tap <b>Start session</b> to track worked time too.')+'</div>';
  }
  const groups=[];
  rows.forEach(l=>{
    const k=dayStart(l.hitAt);
    let g=groups.find(x=>x.k===k);
    if(!g){
      const days=Math.round((dayStart(Date.now())-k)/864e5);
      g={k:k,label:days===0?'Today':days===1?'Yesterday':
        new Date(l.hitAt).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}),rows:[]};
      groups.push(g);
    }
    g.rows.push(l);
  });
  return groups.map(g=>
    '<div class="dayhead"><span class="cap" style="font-size:10.5px">'+g.label+'</span>'+
      '<span class="ln"></span><span class="mu" style="font-size:11px">'+g.rows.length+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+
    g.rows.map(l=>{
      const worked=l.startedAt?fmtDur(l.hitAt-l.startedAt):'';
      const span=l.startedAt
        ? fmtT(l.startedAt)+' → '+fmtT(l.hitAt)
        : 'Limit at '+fmtT(l.hitAt);
      return '<div class="hrow">'+
        '<span class="chip" style="background:'+logColor(l)+'">'+esc(logName(l).charAt(0).toUpperCase())+'</span>'+
        '<div class="sp">'+
          '<div class="row between"><b style="font-size:13.5px">'+esc(logName(l))+'</b>'+
            (worked?'<span class="ok num" style="font-size:13px;font-weight:700">'+worked+'</span>':'')+'</div>'+
          '<div class="mu" style="font-size:12.5px;margin-top:2px">'+span+' · reset '+fmtT(l.resetAt)+'</div>'+
          (l.note?'<div style="font-size:12.5px;margin-top:3px">'+esc(l.note)+'</div>':'')+
        '</div>'+
        '<button class="del" data-del="'+l.id+'" aria-label="Delete session">'+
          '<svg class="ic sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '</div>';
    }).join('')+'</div>'
  ).join('');
}
function streakDays(){
  const set={};
  db.log.forEach(l=>{set[dayStart(l.hitAt)]=1});
  let d=dayStart(Date.now()),n=0;
  if(!set[d])d-=864e5;
  while(set[d]){n++;d-=864e5}
  return n;
}
function insightsHTML(){
  const t=Date.now();
  const from=dayStart(t)-(range-1)*864e5;
  const rows=db.log.filter(l=>l.hitAt>=from);
  const worked=rows.filter(l=>l.startedAt).map(l=>l.hitAt-l.startedAt);
  const avg=worked.length?worked.reduce((a,b)=>a+b,0)/worked.length:0;
  const longest=worked.length?Math.max.apply(null,worked):0;
  const waited=rows.reduce((s,l)=>s+Math.max(0,Math.min(l.resetAt,t)-l.hitAt),0);

  const map={};
  rows.forEach(l=>{const k=dayStart(l.hitAt);map[k]=(map[k]||0)+1});
  const bars=[];
  for(let k=0;k<range;k++){
    const key=from+k*864e5;
    bars.push({key:key,c:map[key]||0});
  }
  const mx=Math.max(1,Math.max.apply(null,bars.map(b=>b.c)));

  const buckets=[0,0,0,0,0,0];
  rows.forEach(l=>{buckets[Math.min(5,Math.floor(new Date(l.hitAt).getHours()/4))]++});
  let peak=0;
  buckets.forEach((v,i)=>{if(v>buckets[peak])peak=i});
  const bucketLabels=['0–4','4–8','8–12','12–16','16–20','20–24'];

  const perAcc=db.accounts.map(a=>({
    a:a,n:rows.filter(l=>l.acc===a.id).length
  })).sort((x,y)=>y.n-x.n);
  const maxAcc=Math.max(1,perAcc[0]?perAcc[0].n:1);

  const rangeBtn=[7,30,90].map(r=>'<button class="fchip '+(range===r?'on':'')+'" data-range="'+r+'">'+r+'d</button>').join('');

  return ''+
  '<div class="fchips">'+rangeBtn+'</div>'+

  '<div class="card">'+
    '<div class="cap">Overview · last '+range+' days</div>'+
    '<div class="statgrid" style="margin-top:14px">'+
      '<div><div class="stat">'+rows.length+'</div><div class="sub">Sessions</div></div>'+
      '<div><div class="stat">'+(worked.length?fmtDur(avg):'—')+'</div><div class="sub">Avg. worked</div></div>'+
      '<div><div class="stat">'+(rows.length?fmtDur(waited):'—')+'</div><div class="sub">Total waited</div></div>'+
      '<div><div class="stat">'+(worked.length?fmtDur(longest):'—')+'</div><div class="sub">Longest session</div></div>'+
    '</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="row between"><div class="cap">Limits per day</div>'+
      '<div class="mu" style="font-size:12px">peak '+mx+'</div></div>'+
    '<div class="chart" style="margin-top:14px;gap:'+(range>30?1:range>7?2:4)+'px">'+
      bars.map((b,i)=>'<div class="cbar '+(i===bars.length-1?'today':'')+'" title="'+fmtD(b.key)+' · '+b.c+'">'+
        '<i style="height:'+Math.max(3,b.c/mx*100)+'%"></i></div>').join('')+
    '</div>'+
    '<div class="row between mu" style="font-size:11px;margin-top:8px">'+
      '<span>'+fmtD(from)+'</span><span>Today</span></div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="cap">When limits hit</div>'+
    '<div class="chart" style="height:64px;margin-top:14px;gap:8px">'+
      buckets.map((v,i)=>'<div class="cbar" title="'+bucketLabels[i]+' · '+v+'">'+
        '<i style="height:'+Math.max(3,v/Math.max(1,Math.max.apply(null,buckets))*100)+'%;background:'+
        (i===peak&&v?'var(--ac)':'var(--ln2)')+'"></i></div>').join('')+
    '</div>'+
    '<div class="row between mu" style="font-size:10.5px;margin-top:6px">'+
      bucketLabels.map(l=>'<span>'+l.split('–')[0]+'</span>').join('')+'</div>'+
    '<div class="note" style="margin-top:10px">'+(rows.length?
      'You hit limits most often between <b>'+bucketLabels[peak]+'</b>.':
      'Not enough data yet.')+'</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="row between"><div class="cap">By account</div>'+
      '<div class="mu" style="font-size:12px">'+streakDays()+' day streak</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">'+
      (perAcc.length?perAcc.map(x=>
        '<div><div class="row between" style="font-size:13px;margin-bottom:5px">'+
          '<span style="font-weight:650">'+esc(x.a.name)+'</span>'+
          '<span class="mu num">'+x.n+' · '+(rows.length?Math.round(x.n/rows.length*100):0)+'%</span></div>'+
          '<div class="bar" style="margin-top:0;height:7px"><i style="width:'+(x.n/maxAcc*100)+'%;background:'+
            COLORS[(x.a.color||0)%COLORS.length].c+'"></i></div></div>').join(''):
        '<div class="note">No accounts yet.</div>')+
    '</div>'+
  '</div>';
}

    '<div class="note" style="margin-top:9px">Scheduled alarms: <b id="pc">…</b>. '+
      'If alarms stay silent with the app closed, set Battery to Unrestricted.</div></section>':
    '<section><div class="note">Notification permissions and background alarms are available in the Android build.</div></section>')+

  '<div class="note center" style="padding:6px 0 18px">Limit Bell v3 · built for Android</div>';

  if(native)pendingCount().then(n=>{const e=$('#pc');if(e)e.textContent=n<0?'—':n});
}
function permRow(name,state,ok,key){
  return '<div class="li"><div class="sp"><div class="t">'+name+'</div>'+
    '<div class="sub '+(ok===true?'ok':ok===false?'bad':'')+'">'+esc(state)+'</div></div>'+
    '<button class="btn sm '+(ok===false?'pri':'')+'" data-perm="'+key+'">'+(ok===false?'Fix':'Open')+'</button></div>';
}
async function refreshPerm(){
  if(!native)return;
  try{perm.notif=(await LN.checkPermissions()).display}catch(e){}
  try{perm.exact=(await LN.checkExactNotificationSetting()).exact_alarm}catch(e){}
  try{if(SO)perm.bat=(await SO.status()).batteryUnrestricted}catch(e){}
  if(tab==='set'&&!sheetOpen&&!modalOpen){
    const y=$('#view').scrollTop;
    renderSet();
    $('#view').scrollTop=y;
  }
}
async function openPhone(target){
  if(!SO){toast('Available in the Android build only');return}
  try{
    const r=await SO.open({target:target});
    if(!r.opened)toast('Could not open this page — open it manually.');
    else if(!r.direct)toast('No direct page here — opened App info.');
  }catch(e){toast('Error: '+(e.message||e))}
}

/* ---------------- actions ---------------- */
function startSession(id){
  const a=db.accounts.find(x=>x.id===id);
  if(!a)return;
  a.startedAt=Date.now();
  a.resetAt=null;a.hitAt=null;a.notified=true;
  persist();
  if(native)cancelFor(a);
  lastStates='';render();
  toast(a.name+': session started');
  tap('MEDIUM');
}
function openLog(id){
  if(!db.accounts.length){openSheet('add',{color:0,windowH:db.settings.windowH});return}
  let accId=id;
  if(!accId||accId==='auto'){
    const list=sortedAccounts();
    const cand=list.find(a=>['free','ready','work'].indexOf(stateOf(a))>=0)||list[0];
    accId=cand.id;
  }
  openSheet('log',{
    accId:accId,hours:db.settings.defaultHours,time:'',note:'',
    early:db.settings.early,save:true
  });
}
function deleteAccount(id){
  const a=db.accounts.find(x=>x.id===id);
  if(!a)return;
  confirmDialog({
    title:'Delete '+a.name+'?',
    msg:'The account is removed. Its session history is kept.',
    ok:'Delete',danger:true,
    onOk:()=>{
      if(native)cancelFor(a);
      db.accounts=db.accounts.filter(x=>x.id!==id);
      persist();closeSheet();lastStates='';render();
      toast('Account deleted');
    }
  });
}

/* ---------------- export ---------------- */
function download(name,text,mime){
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));
    const a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){return false}
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>false);
  }
  return Promise.resolve(false);
}
function toCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const iso=ms=>ms?new Date(ms).toISOString():'';
  return ['account,started,limit_hit,reset,worked_minutes,note']
    .concat(db.log.slice().sort((a,b)=>a.hitAt-b.hitAt).map(l=>[
      q(logName(l)),iso(l.startedAt),iso(l.hitAt),iso(l.resetAt),
      l.startedAt?Math.round((l.hitAt-l.startedAt)/60000):'',q(l.note)
    ].join(','))).join('\n');
}
async function exportCsv(){
  if(!db.log.length){toast('No sessions to export');return}
  const csv=toCSV();
  const ok=await copyText(csv);
  if(ok)toast('CSV copied to clipboard');
  else if(download('limit-bell-sessions.csv',csv,'text/csv'))toast('CSV downloaded');
  else toast('Export failed');
}
async function exportJSON(){
  const payload=JSON.stringify(db,null,2);
  const ok=await copyText(payload);
  if(ok)toast('Backup copied to clipboard');
  else if(download('limit-bell-backup.json',payload,'application/json'))toast('Backup downloaded');
  else toast('Export failed');
}
function importJSON(){
  openModal(
    '<h2>Import backup</h2>'+
    '<p class="mu" style="font-size:13px;margin-top:8px">Paste a Limit Bell JSON backup. This replaces current data.</p>'+
    '<textarea class="field" id="impIn" style="margin-top:14px" placeholder="{ &quot;v&quot;: 3, … }"></textarea>'+
    '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">'+
      '<button class="btn" data-mclose>Cancel</button>'+
      '<button class="btn pri" id="impOk">Import</button></div>'
  );
  $('#impOk').onclick=()=>{
    const raw=$('#impIn').value.trim();
    try{
      const parsed=JSON.parse(raw);
      if(!parsed||!Array.isArray(parsed.accounts))throw new Error('Not a Limit Bell backup');
      parsed.settings=Object.assign({},DEF,parsed.settings||{});
      parsed.log=Array.isArray(parsed.log)?parsed.log:[];
      parsed.v=3;
      db=parsed;
      persist();applyTheme();closeModal();lastStates='';render();
      toast('Backup imported');
    }catch(e){toast('Invalid JSON: '+(e.message||e))}
  };
}

/* ---------------- alerts ---------------- */
function inAppAlert(a){
  alertAccId=a.id;
  $('#aTitle').textContent=a.name+' is ready';
  $('#aBody').textContent='Limit reset at '+fmtT(a.resetAt)+'. Time to get back to work.';
  $('#alert').classList.add('on');
  buzz([280,140,280,140,380]);
  playTone();
}
function closeAlert(){$('#alert').classList.remove('on');alertAccId=null}
$('#aDismiss').addEventListener('click',closeAlert);
$('#aStart').addEventListener('click',()=>{
  const a=db.accounts.find(x=>x.id===alertAccId);
  if(a){a.startedAt=Date.now();a.resetAt=null;a.hitAt=null;a.notified=true;persist();if(native)cancelFor(a)}
  closeAlert();lastStates='';render();
  toast(a?a.name+': session started':'Done');
});
$('#aSnz').addEventListener('click',()=>{
  const a=db.accounts.find(x=>x.id===alertAccId);
  if(a){
    a.resetAt=Date.now()+5*60e3;a.notified=false;a.hitAt=Date.now();
    persist();if(native)scheduleFor(a,true);
    toast('Snoozed for 5 minutes');
  }
  closeAlert();lastStates='';render();
});

/* ---------------- tick ---------------- */
function tick(){
  const t=Date.now();
  let fired=false;
  db.accounts.forEach(a=>{
    if(a.resetAt&&!a.notified&&a.resetAt<=t){
      a.notified=true;fired=true;
      if(db.settings.inApp)inAppAlert(a);
      if(native&&LN){const i=idsFor(a);LN.cancel({notifications:[{id:i.rep}]}).catch(()=>{})}
    }
  });
  if(fired){persist();lastStates='';if(tab==='acc'&&!sheetOpen)renderAcc();return}

  if(tab!=='acc'||sheetOpen||modalOpen)return;

  const sig=db.accounts.map(a=>stateOf(a,t)).join(',');
  if(sig!==lastStates){lastStates=sig;renderAcc();return}

  const hero=heroData(t);
  const ht=$('#heroT');if(ht)ht.textContent=hero.time;
  const hs=$('#heroS');if(hs)hs.textContent=hero.sub;
  const hb=$('#heroB');if(hb)hb.style.width=hero.pct+'%';
  const hr=$('#heroRing');
  if(hr){
    const c=2*Math.PI*32;
    hr.setAttribute('stroke-dashoffset',(c*(1-clamp(hero.pct,0,100)/100)).toFixed(2));
  }
  db.accounts.forEach(a=>{
    const p=parts(a,t);
    const el=document.querySelector('[data-time="'+a.id+'"]');
    if(el)el.textContent=p.time;
    const bar=document.querySelector('[data-bar="'+a.id+'"]');
    if(bar)bar.style.width=p.pct+'%';
  });
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(tab==='acc'&&!sheetOpen)renderAcc();
  if(tab==='set')refreshPerm();
  tick();
});

/* ---------------- event delegation ---------------- */
const SEL=[
  '[data-tab]','[data-log]','[data-menu]','[data-start]','[data-newacc]',
  '[data-seg]','[data-fil]','[data-range]','[data-del]',
  '[data-theme]','[data-accent]','[data-tone]','[data-prev]','[data-tog]',
  '[data-earlymin]','[data-repmin]','[data-window]','[data-dur]',
  '[data-sacc]','[data-sh]','[data-stog]','[data-notepick]','[data-save]',
  '[data-add]','[data-acct]','[data-acct-tg]','[data-swatch]','[data-newcolor]',
  '[data-newwin]','[data-perm]','[data-test]','[data-keep]','[data-csv]',
  '[data-json]','[data-import]','[data-clear]','[data-resetall]',
  '[data-closesheet]','[data-mclose]'
].join(',');

document.addEventListener('click',async function(e){
  const el=e.target.closest(SEL);
  if(!el)return;
  const d=el.dataset;

  /* closes first */
  if(d.closesheet!==undefined){closeSheet();return}
  if(d.mclose!==undefined){closeModal();return}

  /* nav */
  if(d.tab){
    if(tab!==d.tab){tab=d.tab;render();$('#view').scrollTop=0}
    if(tab==='set')refreshPerm();
    tap('LIGHT');
    return;
  }

  /* toast-style interaction feedback */
  if(d.log!==undefined){openLog(d.log);return}
  if(d.menu!==undefined){openSheet('acct',{accId:d.menu});return}
  if(d.start!==undefined){startSession(d.start);return}
  if(d.newacc!==undefined){
    if(db.accounts.length>=8){toast('Maximum of 8 accounts');return}
    openSheet('add',{color:db.accounts.length%COLORS.length,windowH:db.settings.windowH,name:''});
    return;
  }

  /* sessions */
  if(d.seg){sesView=d.seg;renderSes();return}
  if(d.fil){fil=d.fil==='all'?'all':d.fil;
    $$('[data-fil]').forEach(b=>b.classList.toggle('on',b.dataset.fil===String(fil)));
    const w=$('#listWrap');if(w)w.innerHTML=listHTML();return}
  if(d.range){range=+d.range;renderSes();return}
  if(d.del){
    const idx=db.log.findIndex(l=>l.id===d.del);
    if(idx<0)return;
    const removed=db.log.splice(idx,1)[0];
    persist();
    const w=$('#listWrap');if(w)w.innerHTML=listHTML();else renderSes();
    toast('Session deleted','Undo',()=>{
      db.log.push(removed);persist();
      const ww=$('#listWrap');if(ww)ww.innerHTML=listHTML();else renderSes();
      toast('Restored');
    });
    return;
  }

  /* sheet: log */
  if(d.sacc!==undefined){
    sh.accId=d.sacc;
    $$('.who').forEach(b=>b.classList.toggle('on',b.dataset.sacc===d.sacc));
    updatePreview();
    return;
  }
  if(d.sh!==undefined){sh.hours=+d.sh;sh.time='';updatePreview();return}
  if(d.stog){sh[d.stog]=!sh[d.stog];el.classList.toggle('on',sh[d.stog]);
    el.setAttribute('aria-checked',String(!!sh[d.stog]));return}
  if(d.notepick!==undefined){
    const inp=$('#shNote');
    if(inp){inp.value=d.notepick;sh.note=d.notepick}
    return;
  }
  if(d.save!==undefined){saveLog();return}

  /* sheet: add */
  if(d.newcolor!==undefined){sh.color=+d.newcolor;
    $$('[data-newcolor]').forEach(b=>b.classList.toggle('on',+b.dataset.newcolor===sh.color));return}
  if(d.newwin!==undefined){sh.windowH=+d.newwin;
    $$('[data-newwin]').forEach(b=>b.classList.toggle('on',+b.dataset.newwin===sh.windowH));return}
  if(d.add!==undefined){createAccount();return}

  /* sheet: account menu */
  if(d.swatch!==undefined){
    const a=db.accounts.find(x=>x.id===sh.accId);
    if(a){a.color=+d.swatch;persist();
      $$('[data-swatch]').forEach(b=>b.classList.toggle('on',+b.dataset.swatch===a.color));
      lastStates='';}
    return;
  }
  if(d.acctTg!==undefined){
    const a=db.accounts.find(x=>x.id===sh.accId);
    if(a){
      a.alerts=a.alerts===false;
      persist();
      el.classList.toggle('on',a.alerts!==false);
      el.setAttribute('aria-checked',String(a.alerts!==false));
      if(native){if(a.alerts===false)cancelFor(a);else scheduleFor(a,true)}
    }
    return;
  }
  if(d.acct){
    const a=db.accounts.find(x=>x.id===sh.accId);
    if(!a)return;
    if(d.acct==='start'){closeSheet();startSession(a.id);return}
    if(d.acct==='limit'){closeSheet();setTimeout(()=>openLog(a.id),180);return}
    if(d.acct==='rename'){
      closeSheet();
      setTimeout(()=>promptDialog({
        title:'Rename account',label:'Name',value:a.name,maxlength:24,ok:'Save',
        onOk:v=>{
          a.name=(v||('Account '+(db.accounts.indexOf(a)+1))).slice(0,24);
          persist();
          if(native&&a.resetAt)scheduleFor(a,true);
          lastStates='';render();toast('Renamed to '+a.name);
        }
      }),200);
      return;
    }
    if(d.acct==='window'){
      const opts=[1,3,5,8,12];
      openModal('<h2>Session window</h2>'+
        '<p class="mu" style="font-size:13px;margin-top:8px">Used for the working progress bar.</p>'+
        '<div class="grid5" style="margin-top:16px">'+opts.map(h=>
          '<button class="opt '+(a.windowH===h?'on':'')+'" data-wh="'+h+'">'+h+'h</button>').join('')+'</div>'+
        '<div class="row" style="justify-content:flex-end;margin-top:18px">'+
          '<button class="btn" data-mclose>Close</button></div>');
      $('#modalCard').addEventListener('click',function(ev){
        const b=ev.target.closest('[data-wh]');
        if(!b)return;
        a.windowH=+b.dataset.wh;persist();
        $$('[data-wh]').forEach(x=>x.classList.toggle('on',+x.dataset.wh===a.windowH));
      });
      return;
    }
    if(d.acct==='clear'){
      confirmDialog({
        title:'Clear alarm?',msg:'The countdown for '+a.name+' will be removed.',
        ok:'Clear',danger:true,
        onOk:()=>{
          if(native)cancelFor(a);
          a.resetAt=null;a.hitAt=null;a.startedAt=null;a.notified=true;
          persist();closeSheet();lastStates='';render();toast('Alarm cleared');
        }
      });
      return;
    }
    if(d.acct==='delete'){deleteAccount(a.id);return}
  }

  /* settings */
  if(d.theme){db.settings.theme=d.theme;persist();applyTheme();renderSet();return}
  if(d.accent){db.settings.accent=d.accent;persist();applyTheme();renderSet();return}
  if(d.tone){db.settings.tone=d.tone;persist();renderSet();rescheduleAll();return}
  if(d.prev){playTone(d.prev);return}
  if(d.tog){
    db.settings[d.tog]=!db.settings[d.tog];persist();
    if(d.tog==='early'||d.tog==='repeat')rescheduleAll();
    renderSet();return;
  }
  if(d.earlymin!==undefined){db.settings.earlyMin=+d.earlymin;persist();renderSet();rescheduleAll();return}
  if(d.repmin!==undefined){db.settings.repeatMin=+d.repmin;persist();renderSet();rescheduleAll();return}
  if(d.window!==undefined){db.settings.windowH=+d.window;persist();renderSet();return}
  if(d.dur!==undefined){db.settings.defaultHours=+d.dur;persist();renderSet();return}
  if(d.keep!==undefined){
    const opts=[30,90,365,0];
    const i=opts.indexOf(db.settings.keepDays);
    db.settings.keepDays=opts[(i+1)%opts.length];
    persist();pruneLog();persist();renderSet();
    toast('History kept '+(db.settings.keepDays?db.settings.keepDays+' days':'forever'));
    return;
  }
  if(d.csv!==undefined){exportCsv();return}
  if(d.json!==undefined){exportJSON();return}
  if(d.import!==undefined){importJSON();return}
  if(d.clear){
    if(d.clear==='sessions'){
      confirmDialog({title:'Clear sessions?',msg:'All history entries will be deleted.',
        ok:'Clear',danger:true,onOk:()=>{db.log=[];persist();renderSet();toast('Sessions cleared')}});
    }else{
      confirmDialog({title:'Reset everything?',msg:'Accounts, alarms and history will be erased.',
        ok:'Reset',danger:true,onOk:()=>{
          localStorage.removeItem(DBKEY);
          db=migrate();persist();applyTheme();lastStates='';render();toast('Reset complete');
        }});
    }
    return;
  }
  if(d.perm){
    if((d.perm==='notif'||d.perm==='exact')&&LN&&perm.notif!=='granted'){
      if(!(await ensureReady()))return;
    }
    openPhone(d.perm);
    return;
  }
  if(d.test!==undefined){
    const sec=+d.test;
    if(!native){
      inAppAlert({id:'demo',name:'Demo account',resetAt:Date.now()});
      return;
    }
    if(!(await ensureReady()))return;
    const i=idsFor({nid:1});
    try{
      await LN.schedule({notifications:[{id:i.rep,title:'Test alert',
        body:'This is how a limit reset alert looks.',
        schedule:{at:new Date(Date.now()+sec*1000),allowWhileIdle:true},
        channelId:channel()}]});
      toast(sec<=10?'Alert in '+sec+' seconds':'Close the app and wait '+sec+' seconds');
    }catch(err){toast('Error: '+(err.message||err))}
    return;
  }
  if(d.resetall!==undefined){
    confirmDialog({title:'Clear all alarms?',msg:'All running countdowns will be removed.',
      ok:'Clear',danger:true,onOk:()=>{
        db.accounts.forEach(a=>{
          if(native)cancelFor(a);
          a.resetAt=null;a.hitAt=null;a.startedAt=null;a.notified=true;
        });
        persist();lastStates='';render();toast('Alarms cleared');
      }});
    return;
  }
});

/* keyboard activation for role=button */
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){
    e.preventDefault();e.target.click();
  }
  if(e.key==='Escape'){
    if($('#alert').classList.contains('on'))closeAlert();
    else if(modalOpen)closeModal();
    else if(sheetOpen)closeSheet();
  }
});

/* live inputs */
document.addEventListener('input',e=>{
  if(e.target.id==='shNote'&&sh)sh.note=e.target.value;
  if(e.target.id==='newName'&&sh)sh.name=e.target.value;
  if(e.target.id==='searchIn'){
    search=e.target.value;
    const w=$('#listWrap');
    if(w)w.innerHTML=listHTML();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='shTime'&&sh){sh.time=e.target.value;updatePreview()}
});

/* scrim / modal taps */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#scrim').addEventListener('click',closeSheet);

/* hardware back (Capacitor App plugin) */
if(APP&&APP.addListener){
  try{
    APP.addListener('backButton',()=>{
      if($('#alert').classList.contains('on'))return closeAlert();
      if(modalOpen)return closeModal();
      if(sheetOpen)return closeSheet();
    });
  }catch(e){}
}

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme();
  render();
  if(native){
    await nativeInit();
    rescheduleAll();
    refreshPerm();
  }
  tick();
})();
</script>
</body>
